<VirtualHost *:10000>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html
    DirectoryIndex index.php index.html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Never serve secrets / project internals
    <FilesMatch "^(\.env.*|composer\.(json|lock)|Dockerfile|render\.yaml|.*\.sql|.*\.md)$">
        Require all denied
    </FilesMatch>
    <DirectoryMatch "/var/www/html/(vendor|includes|database|\.git)">
        Require all denied
    </DirectoryMatch>

    # Do not execute PHP inside upload folders
    <Directory /var/www/html/admin/uploads>
        <FilesMatch "\.(php|phtml|phar)$">
            Require all denied
        </FilesMatch>
    </Directory>

    # Cache static assets
    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresByType image/png "access plus 30 days"
        ExpiresByType image/jpeg "access plus 30 days"
        ExpiresByType text/css "access plus 7 days"
        ExpiresByType application/javascript "access plus 7 days"
        ExpiresByType audio/mpeg "access plus 30 days"
        ExpiresByType video/mp4 "access plus 30 days"
    </IfModule>

    # Render terminates HTTPS at its proxy
    SetEnvIf X-Forwarded-Proto "https" HTTPS=on

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
